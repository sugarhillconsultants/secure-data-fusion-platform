# Corrected version of the image's default accumulo.properties.
# Confirmed necessary the hard way: the default file (baked into
# accumulo:2.1.2) hardcodes instance.volumes and instance.zookeeper.host
# to localhost, which fails immediately in this multi-container setup
# where namenode/zookeeper are separate services, not localhost. See
# docs/incidents.md.

## Sets location in HDFS where Accumulo will store data.
## Was hdfs://localhost:8020/accumulo in the image's default file —
## corrected to match this compose stack's real namenode service and
## the fs.defaultFS already set in hadoop-config/core-site.xml.
instance.volumes=hdfs://namenode:9000/accumulo

## Sets location of Zookeeper.
## Was localhost:2181 in the image's default file — corrected to match
## this compose stack's real zookeeper service name.
instance.zookeeper.host=zookeeper:2181

## Shared secret between Accumulo servers. The default file ships this
## as the literal placeholder "DEFAULT" with a comment saying to change
## it before initialization — changed here to a distinct value. This is
## a demo/dev-only secret (not a production credential), consistent
## with this stack's other explicitly-documented demo simplifications
## (e.g. xpack.security.enabled=false on Elasticsearch). A real
## deployment should generate this and manage it as a proper secret,
## not commit it to a file at all.
instance.secret=demo-only-not-a-real-secret-change-me

## Unchanged from the image's default — kept as-is since these weren't
## part of the actual failure and there's no reason to touch them.
tserver.memory.maps.native.enabled=true
trace.user=root
trace.password=secret
tserver.port.search=true
