# Full topology matching this project's target architecture. NOT
# executed/verified in this project's development environment — no
# Docker or network access there. Correct compose syntax against known,
# documented images; verify this actually boots and behaves as
# described once run somewhere with real Docker + enough resources
# (expect to need a multi-core, 16GB+ RAM host at minimum — this is a
# genuinely heavy stack, unlike this portfolio's other, lighter Hugging
# Face Space deployments).
#
# Batch-fusion MVP scope: NiFi's job here is "reliably land the two
# synthetic source feeds into HDFS," not real-time Kafka-driven fusion
# (that's the documented next step in docs/architecture.md). Kafka and
# ZooKeeper are included now so the topology matches the target
# architecture end to end, even though the batch MVP doesn't yet route
# live events through them.

services:
  zookeeper:
    image: zookeeper:3.9
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
    # THE ACTUAL ROOT CAUSE of today's repeated Accumulo
    # "instance name" NullPointerExceptions, corrected here: this
    # service had NO persistent volume at all — every single restart
    # wiped ZooKeeper's entire state from scratch, including the
    # instance-name-to-ID mapping Accumulo's Manager/tserver need to
    # resolve "docker-instance" by name. Accumulo's actual table DATA
    # lives safely in HDFS (which does persist correctly, confirmed by
    # the "already initialized" check succeeding), but the METADATA
    # linking the human-readable name to that data lives in ZooKeeper —
    # which was silently reset to empty on every restart, unrelated to
    # anything Accumulo's own init logic does. An earlier theory (that
    # unconditionally passing --clear-instance-name was destructively
    # corrupting this mapping) was a real, valid concern worth fixing
    # too, but was NOT the root cause of this specific symptom
    # persisting across a plain `docker compose down`/`up` cycle with
    # no repeated init calls involved at all. See docs/incidents.md.
    volumes:
      - zookeeper-data:/data
      - zookeeper-datalog:/datalog

  kafka:
    image: bitnami/kafka:3.7
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      ALLOW_PLAINTEXT_LISTENER: "yes"

  nifi:
    image: apache/nifi:1.27.0
    depends_on:
      - kafka
      - namenode
    ports:
      - "8443:8443"
    environment:
      NIFI_WEB_HTTPS_PORT: 8443
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_ADMIN_PASSWORD}
    volumes:
      - ./docker/nifi-flow.xml:/opt/nifi/nifi-current/conf/flow.xml.gz:ro
      - ./data/landing:/opt/nifi/landing

  namenode:
    image: apache/hadoop:3.3.6
    # Confirmed necessary the hard way: the format step failed with
    # "java.io.IOException: Cannot create directory
    # /tmp/hadoop/dfs/name/current" — a fresh Docker named volume is
    # root-owned by default, and this image's default non-root user
    # lacks write access to it. Running as root sidesteps this
    # mismatch entirely; a more production-correct fix would chown the
    # volume to the image's actual hadoop user in an init step instead,
    # but running as root is a reasonable, explicitly-documented
    # trade-off for this demo, consistent with other simplifications
    # already made elsewhere in this project. See docs/incidents.md.
    user: "root"
    # The made-up ENSURE_NAMENODE_DIR env var from the original version
    # of this file did nothing — Hadoop's real configuration model is
    # XML files, not arbitrary environment variables. Confirmed by the
    # actual failure: "Invalid URI for NameNode address (check
    # fs.defaultFS): file:/// has no authority." Fixed via the mounted
    # core-site.xml/hdfs-site.xml below.
    # NOTE: an earlier version of this command always reformatted HDFS
    # on every single container start — a reasonable simplification
    # during rapid same-session debugging (yesterday's attempt at a
    # conditional "format only if needed" check behaved oddly and was
    # abandoned in favor of always-format). That decision turned out to
    # be fundamentally incompatible with the very thing being tested
    # today: real data persistence across an actual VM stop/restart
    # cycle. Confirmed the hard way — after restarting this VM, the
    # exact same "Permission denied creating /accumulo" error from
    # yesterday recurred, because every namenode restart wiped HDFS's
    # metadata clean, including the manually-chowned /accumulo
    # directory. This also explains why datanode exited: a freshly
    # reformatted namenode gets a new cluster ID that no longer matches
    # datanode's own persisted storage — HDFS correctly refuses to let
    # a datanode with a mismatched cluster ID join, a real safety
    # mechanism, not a bug. Fixed properly this time by checking for
    # the actual VERSION file (the file Hadoop writes as the final step
    # of a successful format) rather than just the parent directory's
    # existence — more precise, since a directory can exist without a
    # complete VERSION file if an earlier attempt was interrupted
    # partway through. See docs/incidents.md.
    command: >
      bash -c "
      if [ ! -f /tmp/hadoop/dfs/name/current/VERSION ]; then
        hdfs namenode -format -force -nonInteractive;
      fi;
      hdfs namenode
      "
    # NOTE: `depends_on` alone only waits for a container to START, not
    # for the service inside it to be READY — confirmed the hard way:
    # accumulo failed with "Connection refused" to namenode:9000 even
    # though namenode's own container was already "Up" and its web UI
    # (port 9870) was already reporting healthy. The web UI and the
    # actual RPC port (9000, the one clients use) don't necessarily
    # become ready at the same moment — this bit us specifically when
    # multiple services were brought up in a single `docker compose up`
    # command, giving namenode less of a head start than it had gotten
    # in earlier, separate debugging sessions. This healthcheck tests
    # the real RPC port directly (via `hdfs dfsadmin -report`, using
    # the same client tooling already on this image) so dependents can
    # wait for genuine readiness, not just container start. See
    # docs/incidents.md.
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -report >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
    ports:
      - "9870:9870"
    volumes:
      - hdfs-namenode:/tmp/hadoop/dfs/name
      - ./hadoop-config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop-config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro

  datanode:
    image: apache/hadoop:3.3.6
    # Same root-user fix as namenode above — the datanode writes to its
    # own separate named volume and would hit the identical ownership
    # mismatch once it actually starts trying to store blocks.
    user: "root"
    command: ["hdfs", "datanode"]
    depends_on:
      namenode:
        condition: service_healthy
    volumes:
      - hdfs-datanode:/tmp/hadoop/dfs/data
      - ./hadoop-config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop-config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro

  spark-master:
    image: bitnami/spark:3.5
    environment:
      SPARK_MODE: master
    ports:
      - "8080:8080"
      - "7077:7077"

  spark-worker:
    image: bitnami/spark:3.5
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
    volumes:
      - ./fusion:/opt/fusion:ro

  accumulo:
    # NOTE: there is no official prebuilt apache/accumulo image on Docker
    # Hub — confirmed by Apache's own accumulo-docker repo README, which
    # states this plainly. Build it locally first:
    #   git clone https://github.com/apache/accumulo-docker.git
    #   cd accumulo-docker && docker build -t accumulo:2.1.2 .
    # The default build produces exactly Accumulo 2.1.2 + Hadoop 3.3.6 +
    # ZooKeeper 3.8.2 — matching the versions already used elsewhere in
    # this compose file, so no version mismatch results from this fix.
    image: accumulo:2.1.2
    # The image's ENTRYPOINT is the `accumulo` script itself. A plain
    # `command:` override does NOT replace an image's ENTRYPOINT — it
    # gets appended as arguments to it. Confirmed by the actual failure:
    # `docker compose ps` showed the effective command as
    # "accumulo bash -c '...'". Fixed by explicitly clearing the
    # entrypoint (entrypoint: []) — but that alone then failed with
    # "JAVA_HOME is not set and could not be found", even though
    # JAVA_HOME was confirmed present when tested manually via
    # `docker compose run --entrypoint bash accumulo -c "..."`. The
    # difference: that manual test used exec-form invocation (a clean,
    # direct bash -c call), while the compose file's `command:` was a
    # plain YAML string — which Compose treats as SHELL-FORM, implicitly
    # wrapping it in `/bin/sh -c "..."`. That nested our own `bash -c`
    # inside an extra shell layer, which lost JAVA_HOME along the way.
    # Fixed by using exec-form (YAML lists) for both entrypoint and
    # command, exactly matching the invocation shape that worked
    # manually. See docs/incidents.md.
    entrypoint: ["bash", "-c"]
    # NOTE: a bare `wait` (no arguments) always returns exit code 0 once
    # all background jobs finish, REGARDLESS of whether they actually
    # succeeded — using `wait -n` instead surfaces the actual exit code
    # of whichever background job finishes first.
    #
    # A REAL, subtle bug found here: the original version of this
    # command chained `init && manager &` followed by a separate
    # `tserver &` — but `&` has LOWER precedence than `&&` in bash, so
    # this actually parsed as `(init && manager) &` running as ONE
    # background job, while `tserver &` started as a SEPARATE, parallel
    # background job with no dependency on init finishing at all.
    # Confirmed by the actual failure: "Thread 'tserver' died ...
    # Accumulo not initialized, there is no instance id" — tserver
    # raced ahead and tried to start before init had finished writing
    # the instance ID to HDFS. Fixed by running init as a genuinely
    # sequential statement (semicolon-separated, not &&-chained into
    # the same backgroundable unit) with an explicit exit-code check,
    # so manager/tserver only ever start after init has actually and
    # verifiably completed.
    #
    # --clear-instance-name added after a further real finding: -f/
    # --force and --clear-instance-name are TWO DISTINCT confirmation
    # prompts in Accumulo's own init code (confirmed by reading
    # Initialize.java directly) — -f suppresses the security-info-reset
    # prompt, --clear-instance-name suppresses the separate "this
    # instance name already exists" prompt. Repeated init attempts
    # against the same ZooKeeper state (this compose file's accumulo
    # service was retried several times without a full `down -v` wipe
    # each time) left a stale "docker-instance" registration behind,
    # triggering the second prompt — which calls
    # System.console().readLine(), returning null with no tty attached
    # (a background daemon container has none), causing a
    # NullPointerException. See docs/incidents.md.
    command:
      - >
        INIT_OUTPUT=$$(accumulo init --instance-name docker-instance --password $$ACCUMULO_ROOT_PASSWORD -f 2>&1);
        INIT_EXIT=$$?;
        echo "$$INIT_OUTPUT";
        if [ $$INIT_EXIT -ne 0 ]; then
          if echo "$$INIT_OUTPUT" | grep -q "already initialized"; then
            echo "Accumulo already initialized - continuing to start manager/tserver";
          elif echo "$$INIT_OUTPUT" | grep -qi "instance name.*exists"; then
            echo "Instance name collision detected - retrying with --clear-instance-name";
            accumulo init --instance-name docker-instance --password $$ACCUMULO_ROOT_PASSWORD -f --clear-instance-name;
            if [ $$? -ne 0 ]; then echo "Accumulo init failed even with --clear-instance-name" >&2; exit 1; fi;
          else
            echo "Accumulo init failed for a real reason" >&2;
            exit 1;
          fi
        fi;
        accumulo manager &
        accumulo tserver &
        wait -n
    depends_on:
      zookeeper:
        condition: service_started
      namenode:
        condition: service_healthy
    ports:
      - "9995:9995"
      - "9099:9099"
    environment:
      # ZOOKEEPER_HOST/HDFS_NAMENODE from earlier versions of this file
      # were never real settings this image recognizes — confirmed by
      # inspecting the actual accumulo.properties file, which uses
      # instance.zookeeper.host / instance.volumes instead, now set
      # correctly via the mounted config file above.
      ACCUMULO_ROOT_PASSWORD: ${ACCUMULO_ROOT_PASSWORD}
    volumes:
      # Confirmed via direct inspection (find / -name 'core-site.xml')
      # that this image's bundled Hadoop client looks for its config at
      # exactly this path — the same one already mounted into
      # namenode/datanode. This mount was missing entirely, which is why
      # Accumulo fell back to Hadoop's hardcoded default (localhost:8020)
      # instead of finding the real namenode.
      - ./hadoop-config/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop-config/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      # A SEPARATE, THIRD config layer — Accumulo's own
      # accumulo.properties, independent of the Hadoop core-site.xml
      # fix above. Confirmed via `cat` on the image's default file that
      # instance.volumes and instance.zookeeper.host were also both
      # hardcoded to localhost. See docs/incidents.md.
      - ./accumulo-config/accumulo.properties:/opt/accumulo/conf/accumulo.properties:ro

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "9200:9200"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"

volumes:
  hdfs-namenode:
  hdfs-datanode:
  zookeeper-data:
  zookeeper-datalog:
